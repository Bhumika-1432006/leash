name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests + template lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests (real Cedar evaluation via cedarpy, every boto3 client faked)
        run: python -m pytest -q --ignore=tests/local_demo
        env:
          PYTHONPATH: src

      - name: Local demo smoke test (scripted agent, no model, all routes; budget 10 s)
        run: python -m pytest -q tests/local_demo --durations=5
        env:
          PYTHONPATH: src

      - name: Local demo CLI end to end (no model)
        run: python local_demo/run_demo.py all --scripted | grep -E '^  \[(ALLOW|DENY)' | tee /dev/stderr | grep -c . | xargs test 7 -eq
        env:
          PYTHONPATH: src

      - name: Lint both CloudFormation templates
        run: cfn-lint template.yaml cedar/template.yaml

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: sam validate
        run: |
          sam validate --lint --region us-east-1
          sam validate --lint --region us-east-1 --template cedar/template.yaml
