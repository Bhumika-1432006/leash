AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Leash - an ops agent on a leash. Every action the agent takes is first authorised by
  Cedar policies; every decision is audited. Two switches: Brain (where the model runs:
  Bedrock in Lambda, or a worker anywhere that connects over SQS) and PolicyStore (Amazon
  Verified Permissions, or the Leash authorizer Lambda evaluating the same Cedar text from
  S3). The defaults (worker + s3) deploy on the AWS Free plan. Includes deliberately
  breakable dev infra, a prod-tagged decoy the agent must be denied on, the audit table,
  an HTTP API and a static dashboard.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  Brain:
    Type: String
    Default: worker
    AllowedValues: [worker, bedrock]
    Description: >-
      worker: the agent runs on any machine (local model or Bedrock) and receives alarms and
      requests over SQS - the Free-plan path. bedrock: the agent runs in Lambda on Bedrock.
  PolicyStore:
    Type: String
    Default: s3
    AllowedValues: [s3, avp]
    Description: >-
      s3: the Leash authorizer Lambda evaluates cedar/ from a versioned S3 bucket with cedarpy
      and writes the audit row itself (Free plan). avp: Amazon Verified Permissions.
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model id (inference profile) when Brain=bedrock. Fallback us.amazon.nova-lite-v1:0.
  AlertEmail:
    Type: String
    Description: Email address that receives the SNS incident summaries.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the demo EC2 instances and the Fargate service (default VPC is fine).
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in VpcId (needs an internet route for SSM, ECR and CloudWatch).
  KeyName:
    Type: String
    Default: ""
    Description: Optional EC2 key pair name. Leave empty for no key (SSM only).
  DiskFstype:
    Type: String
    Default: xfs
    Description: >-
      Filesystem type of "/" on the dev instance. AL2023 root is xfs. The CloudWatch
      agent emits it as the "fstype" dimension, so the alarm has to match it exactly.
  DiskPath:
    Type: String
    Default: /
    Description: Mount path the CloudWatch agent watches (the "path" dimension).
  LatestAmiId:
    # SSM public parameter, always resolves to the newest AL2023 x86_64 AMI in the region.
    # https://docs.aws.amazon.com/linux/al2023/ug/ec2.html#launch-from-cloudformation
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI, resolved from the public SSM parameter.

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]
  UseBedrock: !Equals [!Ref Brain, bedrock]
  UseWorker: !Equals [!Ref Brain, worker]
  UseAvp: !Equals [!Ref PolicyStore, avp]
  UseS3Policies: !Equals [!Ref PolicyStore, s3]

Globals:
  Function:
    Runtime: python3.11
    Architectures: [x86_64]

Resources:
  # ---------------------------------------------------------------------------
  # Dependencies layer. Built for Linux/x86_64 by scripts/build-deps.sh (uv with
  # --python-platform) so `sam build` never runs pip on the developer's OS.
  # Carries strands-agents, boto3 and cedarpy (the Cedar engine for the authorizer).
  # ---------------------------------------------------------------------------
  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-deps"
      Description: strands-agents + boto3 + cedarpy, prebuilt for python3.11 on x86_64 Linux
      ContentUri: .build/layer/
      CompatibleRuntimes: [python3.11]
      CompatibleArchitectures: [x86_64]
      RetentionPolicy: Delete

  # -------------------------------------------------------------------------
  # The leash, option A: Amazon Verified Permissions (nested SAM app).
  # -------------------------------------------------------------------------
  Authz:
    Type: AWS::Serverless::Application
    Condition: UseAvp
    Properties:
      Location: cedar/template.yaml

  # -------------------------------------------------------------------------
  # The leash, option B (Free plan): the same Cedar text in a versioned bucket,
  # evaluated by the Leash authorizer Lambda with cedarpy (the Cedar Rust engine).
  # It writes the audit row BEFORE answering, so the caller cannot skip it, and
  # it hot-reloads when a policy object changes. scripts/deploy.sh syncs cedar/.
  # -------------------------------------------------------------------------
  PolicyBucket:
    Type: AWS::S3::Bucket
    Condition: UseS3Policies
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${AWS::StackName}-policies-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AuthzFunction:
    Type: AWS::Serverless::Function
    Condition: UseS3Policies
    Properties:
      FunctionName: !Sub "${AWS::StackName}-authz"
      Description: The leash as a service - Cedar decisions from S3 policies, audit row written first.
      CodeUri: src/
      Layers: [!Ref DepsLayer]
      Handler: authz_service.handler.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          LEASH_LOCAL_AUTHZ: "1"
          LEASH_CEDAR_S3_BUCKET: !Ref PolicyBucket
          AUDIT_TABLE: !Ref AuditTable
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadPolicies
              Effect: Allow
              Action: [s3:GetObject, s3:GetObjectVersion]
              Resource: !Sub "${PolicyBucket.Arn}/cedar/*"
            - Sid: ListPolicies
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt PolicyBucket.Arn
            - Sid: WriteAudit
              Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource:
                - !GetAtt AuditTable.Arn
                - !Sub "${AuditTable.Arn}/index/*"

  # -------------------------------------------------------------------------
  # Audit trail: one item per authorisation decision. GSI "gsi1" partitions:
  # ALL (decisions), REDTEAM (attack rows), REPLY (agent replies to queued asks).
  # -------------------------------------------------------------------------
  AuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${AWS::StackName}-audit"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # -------------------------------------------------------------------------
  # Human notification: the agent publishes a one-paragraph summary here.
  # -------------------------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alerts"
  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # -------------------------------------------------------------------------
  # Brain option A: the worker. Alarms and dashboard requests are queued; the
  # agent process (local_demo/cloud_worker.py) runs anywhere with AWS creds and
  # a model, and every decision still goes through the authorizer in AWS.
  # -------------------------------------------------------------------------
  IncidentDLQ:
    Type: AWS::SQS::Queue
    Condition: UseWorker
    Properties:
      QueueName: !Sub "${AWS::StackName}-incidents-dlq"
      MessageRetentionPeriod: 1209600
  IncidentQueue:
    Type: AWS::SQS::Queue
    Condition: UseWorker
    Properties:
      QueueName: !Sub "${AWS::StackName}-incidents"
      VisibilityTimeout: 900
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IncidentDLQ.Arn
        maxReceiveCount: 3
  RequestDLQ:
    Type: AWS::SQS::Queue
    Condition: UseWorker
    Properties:
      QueueName: !Sub "${AWS::StackName}-requests-dlq"
      MessageRetentionPeriod: 1209600
  RequestQueue:
    Type: AWS::SQS::Queue
    Condition: UseWorker
    Properties:
      QueueName: !Sub "${AWS::StackName}-requests"
      VisibilityTimeout: 900
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RequestDLQ.Arn
        maxReceiveCount: 3
  AlarmToQueueRule:
    Type: AWS::Events::Rule
    Condition: UseWorker
    Properties:
      Name: !Sub "${AWS::StackName}-alarm-to-worker"
      Description: Every leash-* alarm entering ALARM is queued for the worker.
      EventPattern:
        source: [aws.cloudwatch]
        detail-type: ["CloudWatch Alarm State Change"]
        detail:
          state:
            value: [ALARM]
          alarmName:
            - prefix: leash-
      Targets:
        - Id: incidents
          Arn: !GetAtt IncidentQueue.Arn
  # What the brain is allowed to do, and nothing more. Attach to the IAM user or role
  # the worker runs under (README "Run the brain"). No policy read, no audit write of
  # decisions (the authorizer does that), and an explicit Deny on every delete API.
  WorkerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: UseWorker
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-worker"
      Description: Least privilege for the Leash worker (the brain). Cedar decisions come from the authorizer.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadStackOutputs
            Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"
          - Sid: ConsumeQueues
            Effect: Allow
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:GetQueueUrl]
            Resource: [!GetAtt IncidentQueue.Arn, !GetAtt RequestQueue.Arn]
          - Sid: AskTheLeash
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !If [UseS3Policies, !GetAtt AuthzFunction.Arn, !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-authz"]
          - Sid: RepliesResultsHeartbeat
            Effect: Allow
            Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:GetItem, dynamodb:Query]
            Resource:
              - !GetAtt AuditTable.Arn
              - !Sub "${AuditTable.Arn}/index/*"
          - Sid: Notify
            Effect: Allow
            Action: sns:Publish
            Resource: !Ref AlertTopic
          - Sid: SsmRunShellScriptDocument
            Effect: Allow
            Action: ssm:SendCommand
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
          - Sid: SsmOnlyDevInstances
            Effect: Allow
            Action: ssm:SendCommand
            Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
            Condition:
              StringEquals:
                ssm:resourceTag/env: dev
          - Sid: SsmReadResults
            Effect: Allow
            Action: ssm:GetCommandInvocation
            Resource: "*"
          - Sid: ReadOnlyDiscovery
            Effect: Allow
            Action:
              - ec2:Describe*
              - ecs:Describe*
              - ecs:List*
              - autoscaling:Describe*
              - cloudwatch:ListMetrics
              - cloudwatch:GetMetricStatistics
            Resource: "*"
          - Sid: RestartDevService
            Effect: Allow
            Action: ecs:UpdateService
            Resource: !Ref EcsService
          - Sid: ScaleDevGroup
            Effect: Allow
            Action: autoscaling:SetDesiredCapacity
            Resource: !Sub "arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AWS::StackName}-dev-asg"
          - Sid: NeverDestroy
            Effect: Deny
            Action:
              - ec2:TerminateInstances
              - ec2:DeleteVolume
              - ecs:DeleteService
              - ecs:DeleteCluster
              - autoscaling:DeleteAutoScalingGroup
              - dynamodb:DeleteTable
              - s3:DeleteBucket
              - s3:DeleteObject
              - rds:Delete*
            Resource: "*"

  IncidentQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: UseWorker
    Properties:
      Queues: [!Ref IncidentQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridge
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt IncidentQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt AlarmToQueueRule.Arn

  # -------------------------------------------------------------------------
  # Brain option B: the agent in Lambda on Bedrock. Cedar is the leash; the IAM
  # policy below is the floor - even a bug in the agent cannot delete anything.
  # -------------------------------------------------------------------------
  AgentFunction:
    Type: AWS::Serverless::Function
    Condition: UseBedrock
    Properties:
      FunctionName: !Sub "${AWS::StackName}-agent"
      Description: Strands ops agent; every mutating tool is authorised by Cedar first.
      CodeUri: src/
      Layers: [!Ref DepsLayer]
      Handler: agent.handler.handler
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          POLICY_STORE_ID: !If [UseAvp, !GetAtt Authz.Outputs.PolicyStoreId, !Ref "AWS::NoValue"]
          POLICY_ID_MAP: !If [UseAvp, !GetAtt Authz.Outputs.PolicyIdMap, !Ref "AWS::NoValue"]
          LEASH_AUTHZ_FUNCTION: !If [UseS3Policies, !Ref AuthzFunction, !Ref "AWS::NoValue"]
          AUDIT_TABLE: !Ref AuditTable
          ALERT_TOPIC_ARN: !Ref AlertTopic
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ENV_TAG_KEY: env
          SCALE_CAP: "4"
      Events:
        AlarmStateChange:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.cloudwatch]
              detail-type: ["CloudWatch Alarm State Change"]
              detail:
                state:
                  value: [ALARM]
                alarmName:
                  - prefix: leash-
      Policies:
        - Version: "2012-10-17"
          Statement:
            - !If
              - UseAvp
              - Sid: AskCedar
                Effect: Allow
                Action: verifiedpermissions:IsAuthorized
                Resource: !Sub
                  - "arn:${AWS::Partition}:verifiedpermissions::${AWS::AccountId}:policy-store/${StoreId}"
                  - StoreId: !GetAtt Authz.Outputs.PolicyStoreId
              - !Ref "AWS::NoValue"
            - !If
              - UseS3Policies
              - Sid: AskAuthorizer
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AuthzFunction.Arn
              - !Ref "AWS::NoValue"
            - Sid: WriteAudit
              Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource:
                - !GetAtt AuditTable.Arn
                - !Sub "${AuditTable.Arn}/index/*"
            - Sid: Notify
              Effect: Allow
              Action: sns:Publish
              Resource: !Ref AlertTopic
            - Sid: Bedrock
              Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: "*"
            - Sid: SsmRunShellScriptDocument
              Effect: Allow
              Action: ssm:SendCommand
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
            - Sid: SsmOnlyDevInstances
              Effect: Allow
              Action: ssm:SendCommand
              Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
              Condition:
                StringEquals:
                  ssm:resourceTag/env: dev
            - Sid: SsmReadResults
              Effect: Allow
              Action: ssm:GetCommandInvocation
              Resource: "*"
            - Sid: ReadOnlyDiscovery
              Effect: Allow
              Action:
                - ec2:Describe*
                - ecs:Describe*
                - ecs:List*
                - autoscaling:Describe*
                - cloudwatch:ListMetrics
                - cloudwatch:GetMetricData
                - cloudwatch:GetMetricStatistics
              Resource: "*"
            - Sid: RestartDevService
              Effect: Allow
              Action: ecs:UpdateService
              Resource: !Ref EcsService
            - Sid: ScaleDevGroup
              Effect: Allow
              Action: autoscaling:SetDesiredCapacity
              Resource: !Sub "arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AWS::StackName}-dev-asg"
            - Sid: NeverDestroy
              Effect: Deny
              Action:
                - ec2:TerminateInstances
                - ec2:DeleteVolume
                - ecs:DeleteService
                - ecs:DeleteCluster
                - autoscaling:DeleteAutoScalingGroup
                - dynamodb:DeleteTable
                - s3:DeleteBucket
                - rds:Delete*
              Resource: "*"

  # Red-team arena in Lambda (Bedrock mode only; the worker runs it otherwise).
  RedTeamFunction:
    Type: AWS::Serverless::Function
    Condition: UseBedrock
    Properties:
      FunctionName: !Sub "${AWS::StackName}-redteam"
      Description: Attacker model vs the leashed agent, with an unleashed sandbox control arm.
      CodeUri: src/
      Layers: [!Ref DepsLayer]
      Handler: redteam.handler.handler
      Timeout: 900
      MemorySize: 1024
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          POLICY_STORE_ID: !If [UseAvp, !GetAtt Authz.Outputs.PolicyStoreId, !Ref "AWS::NoValue"]
          POLICY_ID_MAP: !If [UseAvp, !GetAtt Authz.Outputs.PolicyIdMap, !Ref "AWS::NoValue"]
          LEASH_AUTHZ_FUNCTION: !If [UseS3Policies, !Ref AuthzFunction, !Ref "AWS::NoValue"]
          AUDIT_TABLE: !Ref AuditTable
          ALERT_TOPIC_ARN: ""
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ENV_TAG_KEY: env
          SCALE_CAP: "4"
          DEV_INSTANCE_ID: !Ref DevInstance
          PROD_INSTANCE_ID: !Ref ProdInstance
          ASG_NAME: !Sub "${AWS::StackName}-dev-asg"
          REDTEAM_MAX_PER_INVOCATION: "12"
      Policies:
        - Version: "2012-10-17"
          Statement:
            - !If
              - UseAvp
              - Sid: AskCedar
                Effect: Allow
                Action: verifiedpermissions:IsAuthorized
                Resource: !Sub
                  - "arn:${AWS::Partition}:verifiedpermissions::${AWS::AccountId}:policy-store/${StoreId}"
                  - StoreId: !GetAtt Authz.Outputs.PolicyStoreId
              - !Ref "AWS::NoValue"
            - !If
              - UseS3Policies
              - Sid: AskAuthorizer
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AuthzFunction.Arn
              - !Ref "AWS::NoValue"
            - Sid: WriteRows
              Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource:
                - !GetAtt AuditTable.Arn
                - !Sub "${AuditTable.Arn}/index/*"
            - Sid: Bedrock
              Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: "*"
            - Sid: ChainSelf
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-redteam"
            - Sid: ReadOnlyDiscovery
              Effect: Allow
              Action:
                - ec2:Describe*
                - ecs:Describe*
                - ecs:List*
                - autoscaling:Describe*
                - cloudwatch:ListMetrics
                - cloudwatch:GetMetricStatistics
              Resource: "*"
            - Sid: SsmRunShellScriptDocument
              Effect: Allow
              Action: ssm:SendCommand
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
            - Sid: SsmOnlyDevInstances
              Effect: Allow
              Action: ssm:SendCommand
              Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
              Condition:
                StringEquals:
                  ssm:resourceTag/env: dev
            - Sid: SsmReadResults
              Effect: Allow
              Action: ssm:GetCommandInvocation
              Resource: "*"
            - Sid: RestartDevService
              Effect: Allow
              Action: ecs:UpdateService
              Resource: !Ref EcsService
            - Sid: ScaleDevGroup
              Effect: Allow
              Action: autoscaling:SetDesiredCapacity
              Resource: !Sub "arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AWS::StackName}-dev-asg"
            - Sid: NeverDestroy
              Effect: Deny
              Action:
                - ec2:TerminateInstances
                - ec2:DeleteVolume
                - ecs:DeleteService
                - ecs:DeleteCluster
                - autoscaling:DeleteAutoScalingGroup
                - dynamodb:DeleteTable
                - s3:DeleteBucket
                - rds:Delete*
              Resource: "*"

  # -------------------------------------------------------------------------
  # HTTP API + API Lambda: /health, /audit, /policies, /redteam, /ask, /reply.
  # -------------------------------------------------------------------------
  LeashApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # The dashboard URL is public: cap it so a shared link cannot burn the credits.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["*"]
        AllowHeaders: ["*"]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Description: Thin HTTP front for the dashboard; reads audit + policies, forwards asks and attacks.
      CodeUri: src/
      Layers: [!Ref DepsLayer]
      Handler: api.handler.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          AUDIT_TABLE: !Ref AuditTable
          AGENT_FUNCTION_NAME: !If [UseBedrock, !Ref AgentFunction, !Ref "AWS::NoValue"]
          REDTEAM_FUNCTION_NAME: !If [UseBedrock, !Ref RedTeamFunction, !Ref "AWS::NoValue"]
          REQUEST_QUEUE_URL: !If [UseWorker, !Ref RequestQueue, !Ref "AWS::NoValue"]
          POLICY_STORE_ID: !If [UseAvp, !GetAtt Authz.Outputs.PolicyStoreId, !Ref "AWS::NoValue"]
          POLICY_ID_MAP: !If [UseAvp, !GetAtt Authz.Outputs.PolicyIdMap, !Ref "AWS::NoValue"]
          LEASH_AUTHZ_FUNCTION: !If [UseS3Policies, !Ref AuthzFunction, !Ref "AWS::NoValue"]
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeashApi
            Path: /health
            Method: GET
        Audit:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeashApi
            Path: /audit
            Method: GET
        Policies:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeashApi
            Path: /policies
            Method: GET
        RedTeamGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeashApi
            Path: /redteam
            Method: GET
        RedTeamPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeashApi
            Path: /redteam
            Method: POST
        Ask:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeashApi
            Path: /ask
            Method: POST
        Reply:
          Type: HttpApi
          Properties:
            ApiId: !Ref LeashApi
            Path: /reply
            Method: GET
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadAudit
              Effect: Allow
              Action: [dynamodb:Query, dynamodb:GetItem]
              Resource:
                - !GetAtt AuditTable.Arn
                - !Sub "${AuditTable.Arn}/index/*"
            - !If
              - UseBedrock
              - Sid: AskAgent
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt AgentFunction.Arn
                  - !GetAtt RedTeamFunction.Arn
              - !Ref "AWS::NoValue"
            - !If
              - UseWorker
              - Sid: QueueRequests
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RequestQueue.Arn
              - !Ref "AWS::NoValue"
            - !If
              - UseAvp
              - Sid: ReadTheLeash
                Effect: Allow
                Action: [verifiedpermissions:ListPolicies, verifiedpermissions:GetPolicy]
                Resource: !Sub
                  - "arn:${AWS::Partition}:verifiedpermissions::${AWS::AccountId}:policy-store/${StoreId}"
                  - StoreId: !GetAtt Authz.Outputs.PolicyStoreId
              - !Ref "AWS::NoValue"
            - !If
              - UseS3Policies
              - Sid: AskAuthorizerForPolicies
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AuthzFunction.Arn
              - !Ref "AWS::NoValue"

  # -------------------------------------------------------------------------
  # Dashboard: public static website bucket. scripts/deploy.sh syncs dashboard/
  # here after writing config.js with the ApiUrl.
  # -------------------------------------------------------------------------
  DashboardBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${AWS::StackName}-dashboard-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicRead
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${DashboardBucket.Arn}/*"

  # -------------------------------------------------------------------------
  # Breakable infra (dev) and a prod decoy. Nothing here has inbound access;
  # the instances are reached through SSM only.
  # -------------------------------------------------------------------------
  LeashSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${AWS::StackName}-no-inbound"
      GroupDescription: No inbound rules. Outbound only (SSM, CloudWatch, ECR).
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-no-inbound"

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy"
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # Dev web box. UserData installs the CloudWatch agent and publishes
  # disk_used_percent for "/" every 10 s so the disk alarm fires within seconds.
  DevInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref LeashSecurityGroup]
      Tags:
        - Key: Name
          Value: leash-dev-web
        - Key: env
          Value: dev
      UserData:
        # Agent config reference: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html
        # drop_device=true removes the "device" dimension and omit_hostname=true the "host"
        # dimension (published by default), so the alarm only needs InstanceId + path + fstype.
        # "${!aws:InstanceId}" is Fn::Sub escaping for the literal "${aws:InstanceId}".
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y amazon-cloudwatch-agent
          cat > /opt/aws/amazon-cloudwatch-agent/etc/config.json <<'CWCFG'
          {
            "agent": { "metrics_collection_interval": 10, "omit_hostname": true },
            "metrics": {
              "namespace": "CWAgent",
              "append_dimensions": { "InstanceId": "${!aws:InstanceId}" },
              "metrics_collected": {
                "disk": {
                  "measurement": ["used_percent"],
                  "metrics_collection_interval": 10,
                  "resources": ["${DiskPath}"],
                  "drop_device": true
                }
              }
            }
          }
          CWCFG
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/config.json

  # Prod decoy. CloudFormation cannot create a stopped instance, so
  # scripts/stop-prod.sh stops it right after deploy. It exists only so the
  # demo can show a real DENY against a real prod-tagged resource.
  ProdInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref LeashSecurityGroup]
      Tags:
        - Key: Name
          Value: leash-prod-db
        - Key: env
          Value: prod

  # ECS Fargate: one nginx task the demo kills; Container Insights supplies
  # the RunningTaskCount metric the alarm watches.
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: leash-dev
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: env
          Value: dev
  EcsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /ecs/leash-api-dev
      RetentionInDays: 7
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
  EcsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: leash-api-dev
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: nginx
          Image: public.ecr.aws/nginx/nginx:latest
          Essential: true
          PortMappings:
            - ContainerPort: 80
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: nginx
  EcsService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: leash-api-dev
      Cluster: !Ref EcsCluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref EcsTaskDefinition
      PropagateTags: SERVICE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetId]
          SecurityGroups: [!Ref LeashSecurityGroup]
      Tags:
        - Key: env
          Value: dev

  # Auto Scaling group at desired 0: costs nothing at rest, max 6 so the
  # Cedar cap of 4 is a real boundary the agent can be asked to cross.
  DevLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-dev-asg"
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: t3.micro
        KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups: [!Ref LeashSecurityGroup]
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: env
                Value: dev
              - Key: Name
                Value: leash-dev-asg-node
  DevAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${AWS::StackName}-dev-asg"
      MinSize: "0"
      DesiredCapacity: "0"
      MaxSize: "6"
      VPCZoneIdentifier: [!Ref SubnetId]
      LaunchTemplate:
        LaunchTemplateId: !Ref DevLaunchTemplate
        Version: !GetAtt DevLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: env
          Value: dev
          PropagateAtLaunch: true
        - Key: Name
          Value: leash-dev-asg
          PropagateAtLaunch: true

  # -------------------------------------------------------------------------
  # Alarms. Names start with "leash-" so the EventBridge rules pick them up.
  # -------------------------------------------------------------------------
  DiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: leash-disk-dev
      AlarmDescription: Root filesystem on leash-dev-web above 85 percent.
      Namespace: CWAgent
      MetricName: disk_used_percent
      Dimensions:
        - Name: InstanceId
          Value: !Ref DevInstance
        - Name: path
          Value: !Ref DiskPath
        - Name: fstype
          Value: !Ref DiskFstype
      Statistic: Maximum
      # The agent publishes every 10 s but not in every 10 s slot; a 10 s alarm period
      # flaps OK/ALARM on the gaps and spawns duplicate incidents. 60 s is steady.
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  EcsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: leash-ecs-dev
      AlarmDescription: leash-api-dev has fewer than 1 running task.
      # Container Insights stops publishing RunningTaskCount when the service has no
      # tasks at all, which is exactly the case we care about. FILL(...) turns that gap
      # into 0 so the alarm fires instead of sitting on "insufficient data".
      Metrics:
        - Id: running
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: ECS/ContainerInsights
              MetricName: RunningTaskCount
              Dimensions:
                - Name: ClusterName
                  Value: !Ref EcsCluster
                - Name: ServiceName
                  Value: !GetAtt EcsService.Name
            Period: 60
            Stat: Minimum
        - Id: running_or_zero
          Expression: FILL(running, 0)
          Label: running tasks (gap = 0)
          ReturnData: true
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

# ---------------------------------------------------------------------------
# Outputs (scripts/*.sh and local_demo/cloud_worker.py read these)
# ---------------------------------------------------------------------------
Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API ($default stage).
    Value: !Sub "https://${LeashApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  DashboardUrl:
    Description: Public static website URL of the dashboard.
    Value: !GetAtt DashboardBucket.WebsiteURL
  DashboardBucket:
    Value: !Ref DashboardBucket
  AuditTableName:
    Value: !Ref AuditTable
  Brain:
    Value: !Ref Brain
  PolicyStoreMode:
    Value: !Ref PolicyStore
  PolicyStoreId:
    Condition: UseAvp
    Value: !GetAtt Authz.Outputs.PolicyStoreId
  PolicyBucket:
    Condition: UseS3Policies
    Value: !Ref PolicyBucket
  AuthzFunctionName:
    Condition: UseS3Policies
    Value: !Ref AuthzFunction
  IncidentQueueUrl:
    Condition: UseWorker
    Value: !Ref IncidentQueue
  RequestQueueUrl:
    Condition: UseWorker
    Value: !Ref RequestQueue
  WorkerPolicyArn:
    Condition: UseWorker
    Description: Attach this managed policy to the IAM user or role the worker runs under.
    Value: !Ref WorkerPolicy
  AgentFunctionName:
    Condition: UseBedrock
    Value: !Ref AgentFunction
  RedTeamFunctionName:
    Condition: UseBedrock
    Value: !Ref RedTeamFunction
  DevInstanceId:
    Value: !Ref DevInstance
  ProdInstanceId:
    Value: !Ref ProdInstance
  EcsClusterName:
    Value: !Ref EcsCluster
  EcsServiceName:
    Value: !GetAtt EcsService.Name
  AsgName:
    Value: !Ref DevAutoScalingGroup
  AlertTopicArn:
    Value: !Ref AlertTopic
